[project]
name = "clinic-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26", "cryptography>=44", "pyotp>=2.9,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.28,<1", "ruff>=0.11", "mypy>=1.15,<2", "pip-audit>=2.8", "bandit>=1.8", "detect-secrets>=1.5", "types-passlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.vercel]
entrypoint = "backend.asgi:app"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".local", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["backend"]

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".tools", ".local", "frontend"]
