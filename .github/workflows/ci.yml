name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: uv run --frozen ruff check backend tests scripts
      - run: uv run --frozen ruff format --check backend tests scripts
      - run: uv run --frozen mypy backend
      - run: uv run --frozen bandit -r backend -q
      - run: uv run --frozen python scripts/check_secrets.py
      - run: uv export --frozen --no-hashes --no-emit-project -o .local-requirements.txt
      - run: uv run --frozen pip-audit -r .local-requirements.txt --strict
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Migrations, PostgreSQL isolation, API and browser
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          RUN_E2E: '1'
          BACKUP_DRILL: '1'
        run: uv run --frozen python scripts/run_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-test-results
          path: |
            .local/pytest.xml
            frontend/test-results/
